<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="纳水溪轴线上的文化活动中心、关帝庙与庙前广场微缩模型，可在白天与夜晚之间切换。">
  <title>微缩模型｜AI 实践｜ZouYe</title>
  <link rel="stylesheet" href="./editorial.css">
  <style>
    body { height: 100svh; overflow: hidden; display: flex; flex-direction: column; background: #e6eee7; }
    .model-stage { position: relative; flex: 1; min-height: 0; }
    .model-stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    .note, .time-dock { position: absolute; z-index: 2; border: 1px solid var(--line); backdrop-filter: blur(16px); }
    .note { top: 96px; left: var(--gutter); width: min(560px, calc(100% - var(--gutter) - 32px)); padding: 16px 20px 18px; border-radius: 8px; background: rgb(241 238 231 / 46%); }
    .note:not([open]) { width: auto; padding-block: 12px; }
    .note summary { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13px; font-weight: 500; letter-spacing: -.02em; list-style: none; }
    .note summary::-webkit-details-marker { display: none; }
    .note summary .ui-icon { width: 16px; height: 16px; transition: transform 180ms ease; }
    .note[open] summary .ui-icon { transform: rotate(180deg); }
    .note p { margin: 12px 0 0; font-size: 12px; line-height: 1.8; color: var(--muted); }
    .note a { display: inline-flex; gap: 8px; margin-top: 14px; padding-bottom: 4px; border-bottom: 1px solid var(--line); text-decoration: none; font-size: 11px; color: var(--ink); }
    .side-rail { position: absolute; z-index: 2; top: 96px; right: var(--gutter); bottom: 16px; display: flex; flex-direction: column; align-items: flex-end; gap: 12px; pointer-events: none; }
    .side-rail > * { pointer-events: auto; }
    .side-rail .time-dock { position: static; }
    .render-preview { position: relative; }
    .render-preview button { min-height: 44px; padding: 0 16px; border: 1px solid var(--line); border-radius: 6px; background: rgb(247 244 237 / 94%); color: var(--ink); font: inherit; font-size: 13px; cursor: help; }
    .render-hint { position: absolute; top: 50%; right: calc(100% + 8px); transform: translateY(-50%); white-space: nowrap; padding: 6px 10px; border-radius: 4px; background: #344939; color: white; font-size: 12px; visibility: hidden; pointer-events: none; }
    .render-preview button:focus + .render-hint { visibility: visible; }
    @media (hover: hover) { .render-preview button:hover + .render-hint { visibility: visible; } }
    .time-dock { right: 16px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 6px; padding: 6px; border-radius: 4px; background: rgb(247 244 237 / 94%); }
    .side-rail .time-dock { transform: none; }
    .time-dock button { display: grid; place-items: center; width: 40px; height: 40px; padding: 0; border: 0; border-radius: 50%; background: transparent; color: var(--ink); cursor: pointer; }
    .time-dock button[aria-pressed="true"] { background: #344939; color: white; }
    .ui-icon--sun { --icon-url: url("./assets/icons/sun.svg"); width: 18px; height: 18px; }
    .ui-icon--moon { --icon-url: url("./assets/icons/moon.svg"); width: 18px; height: 18px; }
    .model-footer { display: flex; justify-content: flex-end; flex-shrink: 0; padding: 12px 22px; border-top: 1px solid var(--line); background: var(--paper); }
    .model-footer a { font-size: .88rem; text-underline-offset: 5px; }
    @media (max-width: 1100px) {
      .note { width: min(560px, calc(100% - var(--gutter) * 2 - 268px)); }
    }
    @media (max-width: 720px) {
      .note { width: calc(100% - var(--gutter) - 16px); }
      .time-dock { top: auto; bottom: 16px; transform: none; flex-direction: row; }
      .side-rail { top: auto; right: 12px; bottom: 12px; align-items: flex-end; }
      .side-rail .time-dock { align-self: flex-end; flex-direction: row; }
    }
    @media (max-width: 600px) {
      .note { top: 124px; left: 12px; width: calc(100% - 24px); }
    }
  </style>
</head>
<body>
  <header class="topbar is-visible">
    <a class="brand-lockup" href="./index.html#home" aria-label="返回首页">
      <span class="brand-mark"><img src="./assets/yvette-portrait.jpg" alt="" width="30" height="30"></span>
      <span class="brand-name">ZouYe</span>
    </a>
    <nav class="site-nav" aria-label="主导航">
      <a href="./index.html#home">首页</a>
      <a href="./index.html#ai-projects">AI实践</a>
      <a href="https://yvette-zoe.github.io/Personal-Architectural-portfolio/" target="_blank" rel="noreferrer">建筑与规划设计</a>
      <a href="./index.html#articles">实践文章</a>
      <a href="./index.html#other">其他</a>
      <a href="./index.html#about">联系我</a>
    </nav>
  </header>
  <div class="model-stage">
    <iframe src="./projects/nashuixi/?time=day" title="纳水溪微缩模型，默认白天"></iframe>
    <details class="note">
      <summary><span class="ui-icon ui-icon--down" aria-hidden="true"></span>说明</summary>
      <p>村落中最为重要的公共建筑是关帝庙，位置在整个核心村落的中心，从古至今一直作为整个村落文化中心，设计将对关帝庙进行功能置入，改造部分内部空间，并结合关帝庙西侧几栋传统民居进行改扩建，恢复村落的文化轴线，重建村民精神文化中心。</p>
      <p>这里展示的就是轴线上文化活动中心、关帝庙、庙前广场的核心设计模型。</p>
      <a href="https://yvette-zoe.github.io/Personal-Architectural-portfolio/#/project/04" target="_blank" rel="noreferrer">项目详情 <span aria-hidden="true">↗</span></a>
    </details>
    <div class="side-rail">
      <div class="render-preview">
        <button type="button" aria-describedby="render-hint">效果图</button>
        <span id="render-hint" class="render-hint" role="tooltip">建设中</span>
      </div>
      <div class="time-dock" role="group" aria-label="切换白天或夜晚">
        <button type="button" data-time="day" aria-pressed="true" aria-label="白天"><span class="ui-icon ui-icon--sun" aria-hidden="true"></span></button>
        <button type="button" data-time="night" aria-pressed="false" aria-label="夜晚"><span class="ui-icon ui-icon--moon" aria-hidden="true"></span></button>
      </div>
    </div>
  </div>
  <footer class="model-footer"><a href="./index.html#ai-projects">返回 AI 实践</a></footer>
  <script>
    const frame = document.querySelector(".model-stage iframe");
    const switches = [...document.querySelectorAll(".time-dock button")];
    let sceneTime = "day";
    function showTime(time) {
      sceneTime = time;
      switches.forEach(button => button.setAttribute("aria-pressed", String(button.dataset.time === time)));
      frame.contentWindow?.postMessage({ type: "nashuixi-time", time }, location.origin);
    }
    switches.forEach(button => button.addEventListener("click", () => showTime(button.dataset.time)));
    frame.addEventListener("load", () => showTime(sceneTime));

    const preview = document.querySelector(".render-preview button");
    preview.addEventListener("click", () => preview.focus());
  </script>
</body>
</html>
