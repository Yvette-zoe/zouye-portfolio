<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="纳水溪轴线上的文化活动中心、关帝庙与庙前广场微缩模型，可在白天与夜晚之间切换。">
  <title>微缩模型｜AI 实践｜ZouYe</title>
  <link rel="stylesheet" href="./editorial.css">
  <style>
    body { height: 100svh; overflow: hidden; display: flex; flex-direction: column; background: #e6eee7; }
    .model-stage { position: relative; flex: 1; min-height: 0; }
    .model-stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    .note, .time-dock, .style-panel { position: absolute; z-index: 2; border: 1px solid var(--line); backdrop-filter: blur(16px); }
    .note { top: 96px; left: var(--gutter); width: min(560px, calc(100% - var(--gutter) - 32px)); padding: 16px 20px 18px; border-radius: 8px; background: rgb(241 238 231 / 46%); }
    .note:not([open]) { width: auto; padding-block: 12px; }
    .note summary { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13px; font-weight: 500; letter-spacing: -.02em; list-style: none; }
    .note summary::-webkit-details-marker { display: none; }
    .note summary .ui-icon { width: 16px; height: 16px; transition: transform 180ms ease; }
    .note[open] summary .ui-icon { transform: rotate(180deg); }
    .note p { margin: 12px 0 0; font-size: 12px; line-height: 1.8; color: var(--muted); }
    .note a { display: inline-flex; gap: 8px; margin-top: 14px; padding-bottom: 4px; border-bottom: 1px solid var(--line); text-decoration: none; font-size: 11px; color: var(--ink); }
    .side-rail { position: absolute; z-index: 2; top: 96px; right: var(--gutter); bottom: 16px; display: flex; flex-direction: column; align-items: flex-end; gap: 12px; pointer-events: none; }
    .side-rail > * { pointer-events: auto; }
    .side-rail .style-panel, .side-rail .time-dock { position: static; }
    .style-panel { width: 244px; max-height: calc(100% - 110px); overflow: auto; padding: 14px 12px 12px; border-radius: 8px; background: rgb(241 238 231 / 46%); }
    .style-panel h2 { margin: 0 6px 4px; font-size: 13px; font-weight: 500; letter-spacing: -.02em; }
    .style-panel > p { margin: 0 6px 10px; font-size: 11px; line-height: 1.6; color: var(--muted); }
    .style-list { display: grid; gap: 4px; }
    .style-option { display: grid; grid-template-columns: 44px 1fr 18px; align-items: center; gap: 10px; width: 100%; padding: 6px; border: 0; border-radius: 6px; background: transparent; color: var(--ink); text-align: left; cursor: pointer; transition: background 180ms ease; }
    .style-option:hover:not(:disabled), .style-option.is-busy { background: rgb(255 253 248 / 70%); }
    .style-option:disabled { cursor: progress; }
    .style-option:disabled:not(.is-busy) { opacity: .5; }
    .style-option img { width: 44px; height: 44px; object-fit: cover; border-radius: 4px; background: #e5e1d9; }
    .style-option strong { display: block; font-size: 12px; font-weight: 500; }
    .style-option small { display: block; margin-top: 2px; font-size: 10px; line-height: 1.5; color: var(--muted); }
    .style-option .ui-icon { width: 16px; height: 16px; color: var(--muted); }
    .style-status { min-height: 16px; margin: 8px 6px 0; font-size: 10px; line-height: 1.6; color: var(--muted); }
    .ui-icon--download { --icon-url: url("./assets/icons/download.svg"); }
    .time-dock { right: 16px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 6px; padding: 6px; border-radius: 4px; background: rgb(247 244 237 / 94%); }
    .side-rail .time-dock { transform: none; }
    .time-dock button { display: grid; place-items: center; width: 40px; height: 40px; padding: 0; border: 0; border-radius: 50%; background: transparent; color: var(--ink); cursor: pointer; }
    .time-dock button[aria-pressed="true"] { background: #344939; color: white; }
    .ui-icon--sun { --icon-url: url("./assets/icons/sun.svg"); width: 18px; height: 18px; }
    .ui-icon--moon { --icon-url: url("./assets/icons/moon.svg"); width: 18px; height: 18px; }
    .model-footer { display: flex; justify-content: flex-end; flex-shrink: 0; padding: 12px 22px; border-top: 1px solid var(--line); background: var(--paper); }
    .model-footer a { font-size: .88rem; text-underline-offset: 5px; }
    @media (max-width: 1100px) {
      .note { width: min(560px, calc(100% - var(--gutter) * 2 - 268px)); }
    }
    @media (max-width: 720px) {
      .note { width: calc(100% - var(--gutter) - 16px); }
      .time-dock { top: auto; bottom: 16px; transform: none; flex-direction: row; }
      .side-rail { top: auto; left: 12px; right: 12px; bottom: 12px; flex-direction: column-reverse; align-items: stretch; }
      .side-rail .time-dock { align-self: flex-end; flex-direction: row; }
      .style-panel { width: auto; max-height: none; padding: 10px; }
      .style-panel > p { display: none; }
      .style-list { grid-auto-flow: column; grid-auto-columns: minmax(150px, 1fr); overflow-x: auto; }
    }
    @media (max-width: 600px) {
      .note { top: 124px; left: 12px; width: calc(100% - 24px); }
    }
  </style>
</head>
<body>
  <header class="topbar is-visible">
    <a class="brand-lockup" href="./index.html#home" aria-label="返回首页">
      <span class="brand-mark"><img src="./assets/yvette-portrait.jpg" alt="" width="30" height="30"></span>
      <span class="brand-name">ZouYe</span>

    <nav class="site-nav" aria-label="主导航">

      <a href="./index.html#articles">实践文章</a>
      <a href="./index.html#other">其他</a>
      <a href="./index.html#about">联系我</a>
    </nav>

  <div class="model-stage">
    <iframe src="./projects/nashuixi/?time=day" title="纳水溪微缩模型，默认白天"></iframe>
    <details class="note" open>
      <summary><span class="ui-icon ui-icon--down" aria-hidden="true"></span>说明</summary>
      <p>村落中最为重要的公共建筑是关帝庙，位置在整个核心村落的中心，从古至今一直作为整个村落文化中心，设计将对关帝庙进行功能置入，改造部分内部空间，并结合关帝庙西侧几栋传统民居进行改扩建，恢复村落的文化轴线，重建村民精神文化中心。</p>
      <p>这里展示的就是轴线上文化活动中心、关帝庙、庙前广场的核心设计模型。</p>
      <a href="https://yvette-zoe.github.io/Personal-Architectural-portfolio/#/project/04" target="_blank" rel="noreferrer">项目详情 <span aria-hidden="true">↗</span></a>
    </details>
    <div class="side-rail">
      <section class="style-panel" aria-labelledby="style-heading">
        <h2 id="style-heading">效果图风格</h2>
        <p>点击即导出该风格的风格视角、鸟瞰轴测、屋顶俯视与四个立面。</p>
        <div class="style-list">
          <button class="style-option" type="button" data-style="sketch"><img src="./assets/projects/nashuixi/styles/sketch.jpg" alt=""><span><strong>纸本淡彩</strong><small>人视街景 · 墨线淡彩</small></span><span class="ui-icon ui-icon--download" aria-hidden="true"></span></button>
          <button class="style-option" type="button" data-style="night"><img src="./assets/projects/nashuixi/styles/night.jpg" alt=""><span><strong>夜景鸟瞰</strong><small>高位鸟瞰 · 灯火雾色</small></span><span class="ui-icon ui-icon--download" aria-hidden="true"></span></button>
          <button class="style-option" type="button" data-style="jiehua"><img src="./assets/projects/nashuixi/styles/jiehua.jpg" alt=""><span><strong>工笔界画</strong><small>平行俯视 · 绢本设色</small></span><span class="ui-icon ui-icon--download" aria-hidden="true"></span></button>
          <button class="style-option" type="button" data-style="shanshui"><img src="./assets/projects/nashuixi/styles/shanshui.jpg" alt=""><span><strong>青绿山水</strong><small>低位仰视 · 远山夕照</small></span><span class="ui-icon ui-icon--download" aria-hidden="true"></span></button>
        </div>
        <p class="style-status" role="status" aria-live="polite"></p>
      </section>
      <div class="time-dock" role="group" aria-label="切换白天或夜晚">
        <button type="button" data-time="day" aria-pressed="true" aria-label="白天"><span class="ui-icon ui-icon--sun" aria-hidden="true"></span></button>
        <button type="button" data-time="night" aria-pressed="false" aria-label="夜晚"><span class="ui-icon ui-icon--moon" aria-hidden="true"></span></button>
      </div>
    </div>
  </div>
  <footer class="model-footer"><a href="./index.html#ai-projects">返回 AI 实践</a></footer>
  <script src="./nashuixi-render.js"></script>
  <script>
    const frame = document.querySelector(".model-stage iframe");
    const switches = [...document.querySelectorAll(".time-dock button")];
    let sceneTime = "day";
    function showTime(time) {
      sceneTime = time;
      switches.forEach(button => button.setAttribute("aria-pressed", String(button.dataset.time === time)));
      frame.contentWindow?.postMessage({ type: "nashuixi-time", time }, location.origin);
    }
    switches.forEach(button => button.addEventListener("click", () => showTime(button.dataset.time)));
    frame.addEventListener("load", () => showTime(sceneTime));

    const styleButtons = [...document.querySelectorAll(".style-option")];
    const styleStatus = document.querySelector(".style-status");
    styleButtons.forEach(button => button.addEventListener("click", async () => {
      const name = button.querySelector("strong").textContent;
      styleButtons.forEach(item => { item.disabled = true; });
      button.classList.add("is-busy");
      try {
        const result = await NashuixiRender.exportStyle(frame, button.dataset.style, (done, total) => {
          styleStatus.textContent = done < total ? `正在生成「${name}」 ${done + 1} / ${total}…` : `正在打包「${name}」…`;
        });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(result.blob);
        link.download = result.name;
        document.body.append(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(link.href), 4000);
        styleStatus.textContent = `已导出「${name}」 ${result.count} 张效果图`;
      } catch (error) {
        console.error(error);
        styleStatus.textContent = error.message === "模型尚未载入完成" ? "模型尚未载入完成，请稍候再试" : "导出失败，请刷新页面后重试";
      } finally {
        button.classList.remove("is-busy");
        styleButtons.forEach(item => { item.disabled = false; });
      }
    }));
  </script>
