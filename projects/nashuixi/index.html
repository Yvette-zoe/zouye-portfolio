<!DOCTYPE html>
<html lang="zh-CN" data-plaza="compact">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="icon" href="data:," />
  <title>纳水溪 · 文化活动中心与关帝庙广场</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #e4ebe4; }
    body { background-image: radial-gradient(ellipse at 48% 66%, rgba(255,224,188,.09), transparent 58%), linear-gradient(155deg, rgba(245,247,227,.05), transparent 58%, rgba(34,54,75,.07)); cursor: grab; touch-action: none; -webkit-tap-highlight-color: transparent; }
    body.dragging { cursor: grabbing; }
    #app { position: fixed; inset: 0; }
    #scene {
      display: block;
      width: 100%;
      height: 100%;
      opacity: 0;
      transition: opacity 1.5s cubic-bezier(.22,.61,.36,1);
      outline: none;
    }
    body.loaded #scene { opacity: 1; }
    canvas { display: block; }
    ::selection { background: transparent; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="./bundle.js"></script>
</body>
</html>
